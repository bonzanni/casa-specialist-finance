api_version: casa.role/v1
id: specialist:finance
kind: specialist
slot: finance
mission: Retrieve and explain household financial records using deterministic arithmetic.
enabled: true
model: {source: fixed, value: sonnet}
tools:
  allowed: [Read, Skill, WebSearch, mcp__casa-framework__get_schedule, mcp__casa-framework__send_media, mcp__casa-framework__ask_user, mcp__casa-framework__recall_memory, mcp__plugin_bank-feed_bank-feed__list_banks, mcp__plugin_bank-feed_bank-feed__link_bank, mcp__plugin_bank-feed_bank-feed__collect_authorization, mcp__plugin_bank-feed_bank-feed__consent_status, mcp__plugin_bank-feed_bank-feed__list_accounts, mcp__plugin_bank-feed_bank-feed__get_balances, mcp__plugin_bank-feed_bank-feed__list_transactions, mcp__plugin_bank-feed_bank-feed__get_transaction, mcp__plugin_bank-feed_bank-feed__list_tags, mcp__plugin_bank-feed_bank-feed__tag_transaction, mcp__plugin_bank-feed_bank-feed__untag_transaction, mcp__plugin_bank-feed_bank-feed__add_note, mcp__plugin_bank-feed_bank-feed__rename_tag, mcp__plugin_bank-feed_bank-feed__delete_tag, mcp__plugin_bank-feed_bank-feed__spend_by_tag, mcp__plugin_bank-feed_bank-feed__add_rule, mcp__plugin_bank-feed_bank-feed__replace_rule, mcp__plugin_bank-feed_bank-feed__list_rules, mcp__plugin_bank-feed_bank-feed__remove_rule, mcp__plugin_bank-feed_bank-feed__apply_rules, mcp__plugin_bank-feed_bank-feed__sync, mcp__plugin_bank-feed_bank-feed__balance_total, mcp__plugin_bank-feed_bank-feed__label_account, mcp__plugin_bank-feed_bank-feed__rename_account, mcp__plugin_bank-feed_bank-feed__unlink_bank, mcp__plugin_bank-feed_bank-feed__export_history, mcp__plugin_bank-feed_bank-feed__purge, mcp__plugin_bank-feed_bank-feed__forget_local_account, mcp__plugin_bank-feed_bank-feed__delete_all_data, mcp__plugin_bank-feed_bank-feed__setup_bank_feed, mcp__plugin_bank-feed_bank-feed__bank_feed_signin, mcp__plugin_bank-feed_bank-feed__accept_app_reregistration]
  disallowed: [Bash, Write, Edit]
  permission_mode: acceptEdits
  max_turns: 10
  skills: all
  voice_guard: none
mcp_servers: [casa-framework]
channels: []
memory: {token_budget: 4000, read_strategy: per_turn}
session: {strategy: ephemeral, idle_timeout_seconds: 0}
disclosure: {policy: delegated, overrides: {}}
delegates: []
executors: []
triggers: []
hooks: {pre_tool_use: []}
tts: {tag_dialect: none, error_phrases: {}}
response:
  text: {register: precise, max_status_sentences: 3}
  voice: {register: spoken, max_status_sentences: 2}
  restricted_webhook: {register: plain, max_status_sentences: 2}
persona:
  policy: optional-but-bound
  compatibility: ["casa/alex@>=0.1.0 <1.0.0"]
requires: {plugins: [bank-feed], tools: [mcp__plugin_bank-feed_bank-feed__list_accounts]}
doctrine_file: doctrine.md
