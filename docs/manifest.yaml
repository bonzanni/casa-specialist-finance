# Publication allowlist (git-tracked only). Verify: python3 -m scripts.verify_docs .
#
# Every file git tracks under docs/ appears here, and every entry here names a file
# git tracks. Both directions are checked: an entry naming an untracked file verifies
# clean locally and publishes nothing.

- doc: manifest.yaml
  kind: meta
  summary: The publication allowlist for this corpus.

- doc: coverage.yaml
  kind: meta
  summary: Code-derived coverage ledger — every enumerated surface maps to a document or an explicit exclusion.

- doc: README.md
  kind: index
  summary: Routing map — what you are about to change, and what to read for it.

- doc: llms.txt
  kind: generated
  summary: Flat index of the corpus, generated from this manifest.

- doc: doctrine/invariants.md
  kind: generated
  summary: Every INV- id, its statement, and the file that defines it.

- doc: doctrine/publishing.md
  summary: The one rule that decides whether a fact may be written down in this repository.
  when_changing: anything published — documents, comments, commit messages, or the gates that enforce them
  covers:
    - scripts/scan_identifiers.py
    - scripts/scan_lineage.py
    - scripts/verify_docs.py
    - .githooks/pre-commit
  tests:
    - tests/test_scan_identifiers.py
    - tests/test_scan_lineage.py
    - tests/test_commit_guard.py
    - tests/test_verify_docs.py
  related: [contributing/doc-contract.md]
  defines_invariants: [INV-PUB-001, INV-PUB-002, INV-PUB-003]
  invariant_tests:
    INV-PUB-001: [tests/test_scan_identifiers.py, tests/test_commit_guard.py]
    INV-PUB-002: [tests/test_scan_lineage.py]
    INV-PUB-003: [tests/test_verify_docs.py]

- doc: architecture/overview.md
  summary: The component's shape — two plugins, one server, one ledger — and which document owns what.
  when_changing: the component layout, the plugin split, or how a tool call is dispatched
  covers:
    - manifest.json
    - role/role.yaml
    - plugins/bank-feed/server/bank_feed_server.py::handle
    - plugins/bank-feed/server/tools_read.py::register
  tests:
    - tests/test_component.py
    - tests/test_server_smoke.py
  related: [architecture/bank-linking.md, architecture/ingestion-and-identity.md, architecture/annotations-and-rules.md, architecture/credentials.md]

- doc: architecture/bank-linking.md
  summary: Two approvals, a callback that never waits, and why backfill runs first.
  when_changing: linking, authorization, renewal, the callback contract, or rate control
  covers:
    - plugins/bank-feed/server/flows.py::backfill
    - plugins/bank-feed/server/flows.py::complete_renewal
    - plugins/bank-feed/server/flows.py::verify_accounts
    - plugins/bank-feed/server/callbacks.py::run_collection
    - plugins/bank-feed/server/eb_ais.py
    - plugins/bank-feed/server/httpx.py
    - plugins/bank-feed/server/tools_refresh.py::_refresh_resource
  tests:
    - tests/test_flows.py
    - tests/test_callbacks.py
    - tests/test_eb.py
    - tests/test_httpx.py
    - tests/test_tools_refresh.py
  related: [architecture/ingestion-and-identity.md, architecture/credentials.md]

- doc: architecture/ingestion-and-identity.md
