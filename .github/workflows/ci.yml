# The suite and every gate, on the version the plugin actually ships against.
#
# Python is pinned to 3.11 rather than left to whatever the runner defaults to:
# `plugins/` is written for 3.11 and standard library only, and a gate that runs
# solely on a newer interpreter is not the gate this code ships under.
#
# The account-data history scan lives in its own workflow (no-account-data.yml)
# because it needs the full history and has a documented reason to fail in the
# private predecessor. This one is about the tip.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Development dependencies only. Nothing here is installed into the
      # plugin: the committed plugin tree must stay byte-identical to the
      # installed artifact, which is why the runtime is standard library only.
      - name: Install development dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Tests
        run: python3 -m unittest discover -s tests

      - name: No account identifier in the working tree
        run: python3 scripts/scan_identifiers.py .

      - name: No private development lineage
        run: python3 scripts/scan_lineage.py .

      - name: The docs corpus describes the code it claims to
        run: python3 -m scripts.verify_docs .

      - name: Every code surface is claimed or excluded
        run: python3 scripts/coverage_ledger.py check .

      - name: No denied path, value or metadata in the tree
        run: scripts/deny-sweep.sh tree

      # The version is pinned and the archive's checksum is verified, because
      # `curl | tar` from a release URL is a third-party fact taken on trust:
      # the tag can be moved and the asset replaced. The wrapper checks the
      # version it ends up with as well, so a substituted binary that reports
      # something else is refused there too.
      #
      # This is also what makes the wrapper's own tests worth having. They
      # drive a stub scanner -- enough to prove the inventory logic, and
      # nothing at all about gitleaks. This step is where the real ruleset
      # runs, and where the wrapper's detection probe is proven against it.
      - name: Install the pinned secret scanner
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version

      - name: No undeclared secret-scanner finding
        run: scripts/run-gitleaks.sh tree

      # The one case in the wrapper's tests that the stub cannot stand in for:
      # the real scan of the real tree, run through the real inventory.
      - name: The wrapper's tests against the real scanner
        env:
          FINANCE_REAL_SCANNER: "1"
        run: python3 -m unittest tests.test_run_gitleaks
